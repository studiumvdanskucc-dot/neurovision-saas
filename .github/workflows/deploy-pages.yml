name: Deploy NeuroVision website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build:github
        env:
          GITHUB_PAGES: "true"
          # This repository owns neurovision-ai.com (see public/CNAME), so the
          # exported site must use domain-root asset URLs. Using the repository
          # path here makes every stylesheet, script and image 404 on the
          # custom domain.
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Validate custom-domain paths
        run: npm run validate:github
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
